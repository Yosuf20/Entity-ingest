[project]
name = "assignment-ai-engg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yosuf20", email = "jyosuf6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
]

[project.scripts]
assignment-ai-engg = "assignment_ai_engg:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
